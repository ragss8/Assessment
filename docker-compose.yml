services:
  postgres:
    image: postgres:16-alpine
    container_name: khatejao-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: khatejao
      POSTGRES_PASSWORD: khatejao
      POSTGRES_DB: khatejao
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khatejao -d khatejao"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
